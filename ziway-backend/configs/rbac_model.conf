# RBAC Model for ziway BOS
# [request_definition] - how requests are represented
[request_definition]
r = sub, obj, act

# [policy_definition] - how policies are stored
[policy_definition]
p = sub, obj, act

# [role_definition] - role hierarchy (optional, for future use)
[role_definition]
g = _, _

# [policy_effect] - how policy decisions combine
[policy_effect]
e = some(where (p.eft == allow))

# [matchers] - how to match requests against policies
[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act)
