version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ziway-ams-postgres
    environment:
      POSTGRES_USER: ziway
      POSTGRES_PASSWORD: ziway123
      POSTGRES_DB: ziway_ams
    ports:
      - "5432:5432"
    volumes:
      - ams-pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziway -d ziway_ams"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ziway-ams-redis
    ports:
      - "6379:6379"
    volumes:
      - ams-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ams-pgdata:
  ams-redis-data:
